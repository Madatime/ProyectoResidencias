<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

	<header th:fragment="topbar(backUrl, backLabel)"
		class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-slate-200 shadow-sm">
		<div class="flex justify-between items-center px-8 py-4">
			<div>
				<a th:href="${backUrl}"
					class="text-2xl font-black text-[#002046] tracking-tight">
					TecNM Campus Chilpancingo
				</a>
				<p class="text-sm text-slate-500 mt-1">
					Sistema Integral de Residencias Profesionales
				</p>
			</div>

			<a th:href="${backUrl}"
				class="inline-flex items-center gap-2 text-slate-600 hover:text-[#003B8F] font-bold transition">
				<span class="material-symbols-outlined text-base">dashboard</span>
				<span th:text="${backLabel}">Dashboard</span>
			</a>
		</div>
	</header>

	<th:block th:fragment="flashMessages(msgSuccess, msgError)">
		<div th:if="${msgSuccess != null}"
			class="mb-6 bg-green-100 border border-green-300 text-green-800 px-5 py-4 rounded-2xl font-semibold flex items-center gap-3 shadow-sm">
			<span class="material-symbols-outlined">check_circle</span>
			<span th:text="${msgSuccess}"></span>
		</div>

		<div th:if="${msgError != null}"
			class="mb-6 bg-red-100 border border-red-300 text-red-800 px-5 py-4 rounded-2xl font-semibold flex items-center gap-3 shadow-sm">
			<span class="material-symbols-outlined">error</span>
			<span th:text="${msgError}"></span>
		</div>
	</th:block>

	<div th:fragment="moduleHero(sectionLabel, title, description, asideContent)"
		class="relative overflow-hidden rounded-3xl primary-gradient text-white p-8 shadow-2xl border border-white/10 mb-8">
		<div class="absolute inset-0 opacity-20 pointer-events-none"
			style="background:
				radial-gradient(circle at top left, #ffffff 0, transparent 28%),
				radial-gradient(circle at bottom right, #60a5fa 0, transparent 30%);">
		</div>

		<div class="absolute -bottom-16 -right-16 w-72 h-72 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>

		<div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-8">
			<div class="max-w-4xl">
				<p class="text-sm text-blue-100 font-semibold mb-2 flex items-center gap-2">
					<span>Panel de Control</span>
					<span class="text-blue-300">›</span>
					<span class="text-white" th:text="${sectionLabel}">Modulo</span>
				</p>

				<h1 class="text-4xl md:text-5xl font-black tracking-tight mb-4"
					th:text="${title}">
					Titulo
				</h1>

				<p class="text-blue-100 text-base max-w-3xl leading-relaxed"
					th:text="${description}">
					Descripcion
				</p>
			</div>

			<div th:replace="${asideContent}"></div>
		</div>
	</div>

	<button th:fragment="tableZoomButton()"
		type="button" onclick="toggleZoomTabla(this)"
		class="inline-flex items-center gap-2 bg-[#003B8F] hover:bg-[#002f73] text-white px-5 py-3 rounded-xl font-bold text-sm transition shadow-lg">
		<span class="material-symbols-outlined text-base">zoom_out_map</span>
		Ajustar tabla
	</button>

	<div th:fragment="tableSummaryFooter(count, nounText, helperText)"
		class="bg-slate-50 px-8 py-4 border-t border-slate-200 flex justify-between items-center">
		<span class="text-xs text-slate-500">
			Mostrando
			<span class="font-black text-[#002046]" th:text="${count}">0</span>
			<span th:text="${nounText}">registros</span>
		</span>

		<span class="text-xs text-slate-400" th:text="${helperText}">
			Resumen de tabla
		</span>
	</div>

	<th:block th:fragment="tableZoomScript()">
		<script>
		function toggleZoomTabla(boton) {
			let contenedor = boton.closest(".tabla-card");
			let tabla = contenedor ? contenedor.querySelector(".tabla-ajustable") : null;

			if (!tabla) {
				contenedor = boton.parentElement;
				while (contenedor && !tabla) {
					tabla = contenedor.querySelector(".tabla-ajustable");
					contenedor = tabla ? contenedor : contenedor.parentElement;
				}
			}

			if (!tabla) {
				return;
			}

			tabla.classList.toggle("tabla-reducida");

			if (tabla.classList.contains("tabla-reducida")) {
				boton.innerHTML = '<span class="material-symbols-outlined text-base">zoom_in_map</span> Restaurar tabla';
			} else {
				boton.innerHTML = '<span class="material-symbols-outlined text-base">zoom_out_map</span> Ajustar tabla';
			}
		}
		</script>
	</th:block>

</body>
</html>
