<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${accion}">Formulario Usuario</title>

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>

<link
	href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
	rel="stylesheet">

<link
	href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
	rel="stylesheet" />

<style>
body {
	font-family: 'Inter', sans-serif;
	background: #f1f5f9;
}
</style>

</head>

<body class="min-h-screen bg-slate-100">

	<div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div>

	<main class="ml-64 min-h-screen">

		<header th:replace="~{fragments/ui :: topbar(@{/usuarios/index}, 'Volver')}"></header>

		<div class="p-8">

		<th:block th:replace="~{fragments/ui :: flashMessages(${msgSuccess}, ${msgError})}"></th:block>

		

		<div
			class="rounded-3xl bg-gradient-to-r from-blue-950 via-blue-800 to-blue-600 p-10 text-white shadow-2xl mb-8">

			<h1 class="text-5xl font-extrabold mb-3"
				th:text="${accion}">
				Formulario Usuario
			</h1>

			<p class="text-blue-100 text-lg max-w-3xl">
				Administra accesos y perfiles del sistema de residencias profesionales.
			</p>

		</div>

		

		<div class="bg-white rounded-3xl shadow-xl overflow-hidden">

			<div class="p-8 border-b border-slate-200">

				<h2 class="text-3xl font-bold text-slate-800 mb-2">
					Datos del Usuario
				</h2>

				<p class="text-slate-500">
					Completa la información requerida.
				</p>

			</div>

			<form th:action="@{/usuarios/save}" method="post"
				th:object="${usuario}" class="p-8">

				<input type="hidden" th:field="*{id}">

				<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

					

					<div>
						<label class="block text-sm font-semibold text-slate-700 mb-2">
							Usuario
						</label>

						<input type="text"
							th:field="*{username}"
							required
							class="w-full rounded-2xl border-slate-300 shadow-sm focus:border-blue-600 focus:ring-blue-600">
					</div>

					

					<div>
						<label class="block text-sm font-semibold text-slate-700 mb-2">
							Nombre Completo
						</label>

						<input type="text"
							th:field="*{nombreCompleto}"
							required
							class="w-full rounded-2xl border-slate-300 shadow-sm focus:border-blue-600 focus:ring-blue-600">
					</div>

					

					<div>
						<label class="block text-sm font-semibold text-slate-700 mb-2">
							Contraseña
						</label>

						<input type="password"
							name="password"
							th:attr="required=${usuario == null or usuario.id == null} ? 'required' : null"
							th:placeholder="${usuario != null and usuario.id != null} ? 'Dejar vacío para conservar la actual' : 'Ingresa la contraseña'"
							class="w-full rounded-2xl border-slate-300 shadow-sm focus:border-blue-600 focus:ring-blue-600">
					</div>

					

					<div>
						<label class="block text-sm font-semibold text-slate-700 mb-2">
							Perfil
						</label>

						<select name="nombrePerfil"
							required
							class="w-full rounded-2xl border-slate-300 shadow-sm focus:border-blue-600 focus:ring-blue-600">

							<option value="">
								Seleccionar perfil
							</option>

							<option
								th:each="perfil : ${perfiles}"
								th:value="${perfil.nombre}"
								th:text="${perfil.nombre}"
								th:selected="${usuario.perfilNombre == perfil.nombre}">
							</option>

						</select>
					</div>

				</div>

				

				<div class="flex justify-end gap-4 mt-10">

					<a th:href="@{/usuarios/index}"
						class="px-6 py-3 rounded-2xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold transition">

						Cancelar

					</a>

					<button type="submit"
						class="px-8 py-3 rounded-2xl bg-blue-700 hover:bg-blue-800 text-white font-bold shadow-lg transition">

						Guardar Usuario

					</button>

				</div>

			</form>

		</div>

		</div>

	</main>

</body>
</html>
